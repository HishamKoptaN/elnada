name: Distribute Main

on:
    push:
        branches: [dev, prod]

jobs:
    deploy_shorebird:
        uses: ./.github/workflows/deploy_shorebird.yml
        with:
            flavor: ${{ github.ref_name }}
        secrets:
            SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    build_installer:
        needs: deploy_shorebird
        uses: ./.github/workflows/build_installer.yml
        with:
            flavor: ${{ github.ref_name }}
            full_version: ${{ needs.deploy_shorebird.outputs.full_version }}

    github_release:
        needs: [deploy_shorebird, build_installer]
        uses: ./.github/workflows/github_release.yml
        with:
            flavor: ${{ github.ref_name }}
            full_version: ${{ needs.deploy_shorebird.outputs.full_version }}
            version_changed: ${{ needs.deploy_shorebird.outputs.version_changed }}
            installer_name: ${{ needs.build_installer.outputs.installer_name }}
        secrets:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    cleanup_releases:
        needs: github_release
        uses: ./.github/workflows/cleanup_releases.yml
        secrets:
            FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
            FIREBASE_ADMIN_SDK: ${{ secrets.FIREBASE_ADMIN_SDK }}
        deploy_shorebird:
            runs-on: windows-latest
            environment: ${{ github.ref_name }}
            outputs:
                full_version: ${{ steps.version.outputs.full_version }}
                version_changed: ${{ steps.deploy.outputs.version_changed }}
            steps:
                - name: Checkout code
                  uses: actions/checkout@v4
                  with:
                      fetch-depth: 0

                - name: Setup Shorebird
                  uses: shorebirdtech/setup-shorebird@v1
                  with:
                      cache: true

                - name: Setup Flutter
                  uses: subosito/flutter-action@v2
                  with:
                      channel: stable
                      cache: true

                - name: Configure Git
                  run: git config --system core.longpaths true

                - name: Upgrade Shorebird
                  run: shorebird upgrade

                # === VERSION DETECTION PHASE ===
                - name: Extract version info
                  id: version
                  shell: pwsh
                  run: |
                      $pubspec = Get-Content pubspec.yaml | Out-String
                      if ($pubspec -match 'version:\s*([^\s]+)') {
                          $version = $matches[1].Trim()
                          echo "full_version=$version" >> $env:GITHUB_OUTPUT
                          echo "FULL_VERSION=$version" >> $env:GITHUB_ENV
                          echo "ORIGINAL_VERSION=$version" >> $env:GITHUB_ENV
                          Write-Host "🔍 Target Version: $version" -ForegroundColor Cyan
                      } else {
                          Write-Error "❌ Could not find version in pubspec.yaml"
                          exit 1
                      }

                - name: Deploy to Shorebird
                  id: deploy
                  shell: pwsh
                  env:
                      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
                  run: |
                      $version = "${{ env.FULL_VERSION }}"
                      $flavor = "${{ github.ref_name }}"
                      $TARGET_ID = if ($flavor -eq "prod") { 
                          "ed427ccb-5edb-4594-a376-2ee9636bef4e" 
                      } else { 
                          "e962126d-ee7a-48f2-b89d-fb0349f4a05f" 
                      }

                      # Switch App ID
                      (Get-Content shorebird.yaml) -replace '^app_id:.*', "app_id: $TARGET_ID" | Set-Content shorebird.yaml
                      Write-Host "✅ App ID Switched to: $TARGET_ID" -ForegroundColor Green

                      # Try PATCH first
                      Write-Host "🚀 Attempting Shorebird PATCH for version $version..." -ForegroundColor Cyan
                      shorebird patch windows --release-version=$version --dart-define=ENV=$flavor --verbose

                      if ($LASTEXITCODE -ne 0) {
                          Write-Host "⚠️ Patch failed. Checking if we need to create a new RELEASE..." -ForegroundColor Yellow

                          # Check if the error is about version already exists
                          $errorOutput = shorebird release windows --dart-define=ENV=$flavor --verbose 2>&1
                          if ($errorOutput -match "existing.*release.*version.*Please bump your version number") {
                              Write-Host "🔄 Version $version already exists. Auto-bumping version..." -ForegroundColor Yellow

                              # Auto-bump version
                              $versionParts = $version.Split('+')
                              if ($versionParts.Count -eq 2) {
                                  $baseVersion = $versionParts[0]
                                  $buildNumber = [int]$versionParts[1]
                                  $newBuildNumber = $buildNumber + 1
                                  $newVersion = "$baseVersion+$newBuildNumber"

                                  Write-Host "📈 Bumping version to: $newVersion" -ForegroundColor Green

                                  # Update pubspec.yaml
                                  (Get-Content pubspec.yaml) -replace "version:\s*$version", "version: $newVersion" | Set-Content pubspec.yaml

                                  # Update environment variable
                                  echo "FULL_VERSION=$newVersion" >> $env:GITHUB_ENV

                                  # Commit and push version bump
                                  git config --global user.name "github-actions[bot]"
                                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                                  git add pubspec.yaml
                                  git commit -m "chore: bump version to $newVersion for $flavor release [skip ci]"
                                  git push origin $flavor

                                  Write-Host "🚀 Now creating new RELEASE with version $newVersion..." -ForegroundColor Cyan
                                  shorebird release windows --dart-define=ENV=$flavor --verbose

                                  if ($LASTEXITCODE -ne 0) {
                                      Write-Host "❌ Release failed even after version bump" -ForegroundColor Red
                                      exit 1
                                  } else {
                                      Write-Host "✅ Release succeeded with new version $newVersion" -ForegroundColor Green
                                  }
                              } else {
                                  Write-Host "❌ Invalid version format: $version" -ForegroundColor Red
                                  exit 1
                              }
                          }

                          if ($LASTEXITCODE -ne 0) {
                              Write-Host "❌ Failed to Patch or Release. Check the logs above for specific errors." -ForegroundColor Red
                              exit 1
                          } else {
                              Write-Host "✅ Release succeeded" -ForegroundColor Green
                          }
                      } else {
                          Write-Host "✅ Patch succeeded" -ForegroundColor Green
                          echo "version_changed=false" >> $env:GITHUB_OUTPUT
                      }

        # ============================================================
        # JOB 2: Build Installer
        # Build Windows installer using Inno Setup
        # Depends on: deploy_shorebird
        # ============================================================
        build_installer:
            needs: deploy_shorebird
            runs-on: windows-latest
            environment: ${{ github.ref_name }}
            outputs:
                installer_name: ${{ steps.prepare_assets.outputs.installer_name }}
                exe_name: ${{ steps.prepare_assets.outputs.exe_name }}
            steps:
                - name: Checkout code
                  uses: actions/checkout@v4
                  with:
                      fetch-depth: 0

                - name: Configure Git
                  run: git config --system core.longpaths true

                - name: Prepare installer template
                  shell: pwsh
                  run: |
                      $issPath = "./installers/abujena_setup.iss"
                      if (Test-Path $issPath) {
                          $issContent = Get-Content $issPath -Raw
                          $newIssContent = $issContent -replace "APP_VERSION_PLACEHOLDER", "${{ needs.deploy_shorebird.outputs.full_version }}"
                          [System.IO.File]::WriteAllText((Get-Item $issPath).FullName, $newIssContent)
                          Write-Host "✅ Installer template prepared" -ForegroundColor Green
                      } else {
                          Write-Warning "⚠️ ISS file not found at $issPath. Skipping template preparation."
                      }

                # === INSTALLER BUILD PHASE ===
                - name: Build installer
                  shell: pwsh
                  run: |
                      try {
                        Write-Host "🔨 Compiling installer..."
                        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ./installers/abujena_setup.iss
                        Write-Host "✅ Installer compiled successfully"
                      } catch {
                        Write-Host "❌ Installer compilation failed: $_"
                        exit 1
                      }

                - name: Prepare final assets
                  id: prepare_assets
                  shell: pwsh
                  run: |
                      $newName = if ("${{ github.ref_name }}" -eq "dev") { "abujena_dawajen_dev.exe" } else { "abujena_dawajen.exe" }
                      $installerName = if ("${{ github.ref_name }}" -eq "dev") { "abujena_setup_dev.exe" } else { "abujena_setup.exe" }

                      # Rename the output file if it exists
                      $outputPath = "./Output/$installerName"
                      if (Test-Path $outputPath) {
                          Write-Host "✅ Found installer at: $outputPath" -ForegroundColor Green
                      }

                      echo "exe_name=$newName" >> $env:GITHUB_OUTPUT
                      echo "installer_name=$installerName" >> $env:GITHUB_OUTPUT

                - name: Upload installer artifact
                  uses: actions/upload-artifact@v4
                  with:
                      name: installer
                      path: ./Output/${{ steps.prepare_assets.outputs.installer_name }}
                      retention-days: 1

        # ============================================================
        # JOB 3: GitHub Release
        # Create GitHub release and upload assets
        # Depends on: build_installer
        # ============================================================
        github_release:
            needs: [deploy_shorebird, build_installer]
            runs-on: windows-latest
            environment: ${{ github.ref_name }}
            steps:
                - name: Checkout code
                  uses: actions/checkout@v4
                  with:
                      fetch-depth: 0

                - name: Download artifacts
                  uses: actions/download-artifact@v4
                  with:
                      path: ./artifacts

                - name: Prepare release assets
                  shell: pwsh
                  run: |
                      $installerName = "${{ needs.build_installer.outputs.installer_name }}"
                      $sourcePath = "./artifacts/installer/$installerName"
                      $destPath = "./Output/$installerName"

                      if (Test-Path $sourcePath) {
                          New-Item -ItemType Directory -Force -Path "./Output"
                          Copy-Item $sourcePath $destPath
                          Write-Host "✅ Prepared installer: $installerName" -ForegroundColor Green
                      } else {
                          Write-Warning "⚠️ Installer not found at $sourcePath"
                      }

                - name: Update appcast
                  shell: pwsh
                  run: |
                      $version = "${{ needs.deploy_shorebird.outputs.full_version }}"
                      $fileName = "${{ needs.build_installer.outputs.installer_name }}"
                      $filePath = "./Output/$fileName"
                      $fileLength = if (Test-Path $filePath) { (Get-Item $filePath).Length } else { 0 }
                      $url = "https://github.com/${{ github.repository }}/releases/latest/download/$fileName"
                      $xmlPath = "desktop_appcast.xml"
                      $currentDate = Get-Date -Format "ddd, dd MMM yyyy HH:mm:ss K"

                      if (Test-Path $xmlPath) {
                        $content = Get-Content $xmlPath -Raw
                        $content = $content -replace 'sparkle:version="[^"]*"', "sparkle:version=""$version"""
                        $content = $content -replace 'sparkle:shortVersionString="[^"]*"', "sparkle:shortVersionString=""$version"""
                        $content = $content -replace 'url="[^"]*"', "url=""$url"""
                        $content = $content -replace 'length="[^"]*"', "length=""$fileLength"""
                        $content = $content -replace '<title>Version [^<]*</title>', "<title>Version $version</title>"
                        $content = $content -replace '<pubDate>[^<]*</pubDate>', "<pubDate>$currentDate</pubDate>"
                        [System.IO.File]::WriteAllText((Get-Item $xmlPath).FullName, $content)
                        
                        git config --global user.name "github-actions[bot]"
                        git config --global user.email "github-actions[bot]@users.noreply.github.com"
                        git add $xmlPath
                        git commit -m "chore: sync appcast to $version [skip ci]" || echo "No changes"
                        git push origin ${{ github.ref_name }}
                        
                        Write-Host "✅ Appcast updated" -ForegroundColor Green
                      } else {
                        Write-Warning "⚠️ Appcast file not found. Skipping update."
                      }

                - name: Create GitHub Release
                  uses: softprops/action-gh-release@v2
                  with:
                      tag_name: ${{ github.ref_name == 'prod' && 'latest' || format('latest_{0}', github.ref_name) }}
                      name: ${{ github.ref_name == 'prod' && format('Release v{0}', needs.deploy_shorebird.outputs.full_version) || format('Release v{0} ({1})', needs.deploy_shorebird.outputs.full_version, github.ref_name) }}
                      body: |
                          ## 🚀 Release v${{ needs.deploy_shorebird.outputs.full_version }}

                          ### Changes
                          - Automated release from ${{ github.ref_name }} branch
                          - Shorebird deployment: ${{ needs.deploy_shorebird.outputs.version_changed == 'true' && 'New Release' || 'Patch' }}

                          ### Downloads
                          - **Installer**: `${{ needs.build_installer.outputs.installer_name }}`
                      files: ./Output/${{ needs.build_installer.outputs.installer_name }}
                      make_latest: true
                      prerelease: ${{ github.ref_name == 'dev' }}
                      draft: false
                  env:
                      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        # ============================================================
        # JOB 4: Cleanup Releases
        # Cleanup old Firebase releases
        # Depends on: github_release
        # ============================================================
        cleanup_releases:
            needs: github_release
            runs-on: ubuntu-latest
            steps:
                - name: Checkout code
                  uses: actions/checkout@v4

                - name: Setup Flutter
                  uses: subosito/flutter-action@v2
                  with:
                      channel: stable
                      cache: true

                - name: Install dependencies for Automation Tool
                  run: |
                      cd .github/scripts/automation_tool
                      rm -f lib/**/*.freezed.dart lib/**/*.g.dart
                      dart pub get
                      dart run build_runner build --delete-conflicting-outputs

                - name: Cleanup old releases
                  working-directory: .github/scripts/automation_tool
                  env:
                      FIREBASE_PROJECT_NUMBER: "448994699498"
                      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
                      FIREBASE_ADMIN_SDK: ${{ secrets.FIREBASE_ADMIN_SDK }}
                  run: dart bin/main.dart cleanup
                  continue-on-error: true
