name: Dev Distribute
on:
    push:
        branches: [dev]
jobs:
    build_desktop:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
            - name: Install MSIX Package
              run: flutter pub get
            - name: Build Windows
              run: flutter build windows --release --dart-define=ENV=prod
            - name: Create MSIX Installer
              run: flutter pub run msix:create
            - name: Upload MSIX Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: windows-installer
                  path: build/windows/x64/runner/Release/*.msix
            - name: Enable Windows Desktop
              run: flutter config --enable-windows-desktop
            - name: Install Dependencies
              run: flutter pub get
            - name: Build Windows
              run: flutter build windows --release --dart-define=ENV=prod
            - name: Package Windows Release
              shell: powershell
              run: |
                  $compressPath = "build\windows\x64\runner\Release"
                  Compress-Archive -Path "$compressPath\*" -DestinationPath "abujena_dawajen_windows.zip"
            - name: Upload Windows Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: windows-app-zip
                  path: abujena_dawajen_windows.zip
