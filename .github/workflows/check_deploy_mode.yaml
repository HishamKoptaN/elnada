name: Distribute Desktop (Smart Deploy)
on:
    push:
        branches: [prod, dev]
jobs:
    build_desktop:
        runs-on: windows-latest
        environment: ${{ github.ref_name }}
        steps:
            - name: 📂 Checkout Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: 🐦 Setup Shorebird
              uses: shorebirdtech/setup-shorebird@v1
              with:
                  cache: true
            - name: 🧩 Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true
            - name: 🔄 Upgrade Shorebird
              run: shorebird upgrade
            - name: 🛠️ Fix Windows Long Paths
              run: git config --system core.longpaths true

            - name: � Smart Deploy (Patch First)
              shell: pwsh
              env:
                  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
              run: |
                  # 1. استخراج الإصدار من pubspec.yaml
                  $pubspec = Get-Content pubspec.yaml | Out-String
                  if ($pubspec -match 'version:\s*([^\s]+)') {
                      $version = $matches[1].Trim()
                      echo "FULL_VERSION=$version" >> $env:GITHUB_ENV
                      Write-Host "🔍 Target Version: $version" -ForegroundColor Cyan
                  } else {
                      Write-Error "❌ Could not find version in pubspec.yaml"
                      exit 1
                  }

                  $flavor = "${{ github.ref_name }}"
                  $TARGET_ID = if ($flavor -eq "prod") { "ed427ccb-5edb-4594-a376-2ee9636bef4e" } else { "e962126d-ee7a-48f2-b89d-fb0349f4a05f" }
                  (Get-Content shorebird.yaml) -replace '^app_id:.*', "app_id: $TARGET_ID" | Set-Content shorebird.yaml
                  Write-Host "✅ App ID Switched to: $TARGET_ID" -ForegroundColor Green

                  # 3. الحل الذكي: جرب patch أولاً، لو فشل اعمل release
                  Write-Host "� Trying PATCH first..."

                  shorebird patch windows --release-version=$version --dart-define=ENV=$flavor --verbose

                  if ($LASTEXITCODE -ne 0) {
                      Write-Host "📦 Patch failed → fallback to RELEASE" -ForegroundColor Yellow
                      shorebird release windows --dart-define=ENV=$flavor --verbose
                      
                      if ($LASTEXITCODE -ne 0) {
                          Write-Host "❌ Both PATCH and RELEASE failed!" -ForegroundColor Red
                          exit 1
                      } else {
                          Write-Host "✅ Release succeeded" -ForegroundColor Green
                      }
                  $flavor = "${{ github.ref_name }}"
                  if ("${{ env.DEPLOY_MODE }}" -eq "PATCH") {
                    Write-Host "🔧 Running Patch for $flavor (Version: ${{ env.FULL_VERSION }})..."
                    shorebird patch windows --release-version=${{ env.FULL_VERSION }} --dart-define=ENV=$flavor --verbose
                  } else {
                    Write-Host "📦 Running New Release for $flavor..."
                    shorebird release windows --dart-define=ENV=$flavor --verbose
                  }

            - name: 🔨 Compile Installer (Inno Setup)
              shell: pwsh
              run: |
                  # تحديث نسخة التطبيق داخل ملف ISS قبل البناء
                  $issPath = "./installers/abujena_setup.iss"
                  if (Test-Path $issPath) {
                      $issContent = Get-Content $issPath -Raw
                      $newIssContent = $issContent -replace "APP_VERSION_PLACEHOLDER", "${{ env.FULL_VERSION }}"
                      [System.IO.File]::WriteAllText((Get-Item $issPath).FullName, $newIssContent)
                      
                      Write-Host "🔨 Compiling Installer..."
                      & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $issPath
                  } else {
                      Write-Warning "⚠️ ISS file not found at $issPath. Skipping compilation."
                  }
