name: Distribute Android

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
    secrets:
      FIREBASE_APP_ID:
        required: true
      FIREBASE_ADMIN_SDK:
        required: true
      SHOREBIRD_TOKEN:
        required: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    outputs:
      is_new_release: ${{ steps.build.outputs.is_new_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          cache: true

      - uses: shorebirdtech/setup-shorebird@v1

      - id: build
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          version=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d '"')
          baseVersion=$(echo "$version" | cut -d'+' -f1)
          flavor="${{ inputs.flavor }}"
          
          TARGET_ID="e962126d-ee7a-48f2-b89d-fb0349f4a05f"
          if [ "$flavor" = "prod" ]; then
            TARGET_ID="ed427ccb-5edb-4594-a376-2ee9636bef4e"
          fi
          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          
          androidReleaseVersion="$version"
          if [ "$flavor" != "prod" ]; then
            androidReleaseVersion=$(echo "$version" | sed "s/+/-$flavor+/")
          fi
          
          echo "Building APK: $androidReleaseVersion"
          shorebird release android --flavor=$flavor --build-name="$baseVersion" --dart-define=ENV=$flavor || true
          
          if [ -f "build/app/outputs/flutter-apk/app-$flavor-release.apk" ]; then
            echo "is_new_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_new_release=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.build.outputs.is_new_release == 'true'
        id: apk_name
        run: |
          if [ "${{ inputs.flavor }}" = "prod" ]; then
            echo "name=android-apk" >> $GITHUB_OUTPUT
          else
            echo "name=android-apk_${{ inputs.flavor }}" >> $GITHUB_OUTPUT
          fi

      - if: steps.build.outputs.is_new_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_name.outputs.name }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - if: steps.build.outputs.is_new_release == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_ADMIN_SDK }}
          groups: "internal-testers"
          file: build/app/outputs/flutter-apk/app-${{ inputs.flavor }}-release.apk

      - if: steps.build.outputs.is_new_release == 'true'
        id: release_tag
        run: |
          if [ "${{ inputs.flavor }}" = "prod" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=latest_${{ inputs.flavor }}" >> $GITHUB_OUTPUT
          fi

      - if: steps.build.outputs.is_new_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ inputs.flavor == 'prod' && 'Latest Release' || format('Latest {0}', inputs.flavor) }}
          files: build/app/outputs/flutter-apk/*.apk
          prerelease: ${{ inputs.flavor == 'dev' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
