name: Distribute Android
on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
    secrets:
      FIREBASE_APP_ID:
        required: true
      FIREBASE_ADMIN_SDK:
        required: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download APK Artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ inputs.flavor }}
          path: build/app/outputs/flutter-apk/
        continue-on-error: true

      - name: Check if APK exists
        id: check_apk
        run: |
          if [ -f "build/app/outputs/flutter-apk/app-${{ inputs.flavor }}-release.apk" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️ APK not found, skipping distribution"
          fi

      - name: Set APK Name
        if: steps.check_apk.outputs.found == 'true'
        id: apk_name
        run: |
          if [ "${{ inputs.flavor }}" = "prod" ]; then
            echo "name=android-apk" >> $GITHUB_OUTPUT
          else
            echo "name=android-apk_${{ inputs.flavor }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Artifact (Backup)
        if: steps.check_apk.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_name.outputs.name }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Firebase Distribution
        if: steps.check_apk.outputs.found == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_ADMIN_SDK }}
          groups: "internal-testers"
          file: build/app/outputs/flutter-apk/app-${{ inputs.flavor }}-release.apk

      - name: Set Release Tag
        if: steps.check_apk.outputs.found == 'true'
        id: release_tag
        run: |
          if [ "${{ inputs.flavor }}" = "prod" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=latest_${{ inputs.flavor }}" >> $GITHUB_OUTPUT
          fi

      - name: GitHub Release
        if: steps.check_apk.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ inputs.flavor == 'prod' && 'Latest Release' || format('Latest {0}', inputs.flavor) }}
          files: build/app/outputs/flutter-apk/*.apk
          prerelease: ${{ inputs.flavor == 'dev' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
