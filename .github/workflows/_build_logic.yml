name: Build and Shorebird Logic

on:
    workflow_call:
        outputs:
            full_version:
                description: "App Version"
                value: ${{ jobs.build.outputs.version }}
            final_file_name:
                description: "Installer Name"
                value: ${{ jobs.build.outputs.file_name }}

jobs:
    build:
        runs-on: windows-latest
        outputs:
            version: ${{ steps.get_version.outputs.FULL_VERSION }}
            file_name: ${{ steps.prepare_assets.outputs.FINAL_FILE_NAME }}
        steps:
            - uses: actions/checkout@v4
            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true

            - id: get_version
              shell: pwsh
              run: |
                  $line = Get-Content pubspec.yaml | Select-String "^version: "
                  $v = ($line -split " ")[1].Trim()
                  echo "FULL_VERSION=$v" >> $env:GITHUB_OUTPUT

            - uses: shorebirdtech/setup-shorebird@v1
              with:
                  cache: true

            - name: Shorebird Smart Deploy
              shell: pwsh
              env:
                  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
              run: |
                  $flavor = "${{ github.ref_name }}"
                  $version = "${{ steps.get_version.outputs.FULL_VERSION }}"
                  $TARGET_ID = if ($flavor -eq "prod") { "ed427ccb-5edb-4594-a376-2ee9636bef4e" } else { "e962126d-ee7a-48f2-b89d-fb0349f4a05f" }

                  (Get-Content shorebird.yaml) -replace '^app_id:.*', "app_id: $TARGET_ID" | Set-Content shorebird.yaml

                  $releases = shorebird releases list | Out-String
                  if ($releases -match [regex]::Escape($version)) {
                    shorebird patch windows --release-version=$version --dart-define=ENV=$flavor
                  } else {
                    shorebird release windows --dart-define=ENV=$flavor
                  }

            - name: Compile Installer
              shell: pwsh
              run: |
                  # تحديث الـ ISS قبل البناء
                  $issPath = "installers/abujena_setup.iss"
                  $content = Get-Content $issPath -Raw
                  $newContent = $content -replace "APP_VERSION_PLACEHOLDER", "${{ steps.get_version.outputs.FULL_VERSION }}"
                  [System.IO.File]::WriteAllText((Get-Item $issPath).FullName, $newContent)
                  & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $issPath

            - id: prepare_assets
              shell: pwsh
              run: |
                  $newName = if ("${{ github.ref_name }}" -eq "dev") { "abujena_dawajen_dev.exe" } else { "abujena_dawajen.exe" }
                  $setupFile = Get-ChildItem "installers/*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
                  Rename-Item -Path $setupFile.FullName -NewName $newName
                  echo "FINAL_FILE_NAME=$newName" >> $env:GITHUB_OUTPUT
