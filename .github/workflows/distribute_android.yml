name: Distribute Android
on:
  push:
    branches: [prod, dev]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash"
      - uses: shorebirdtech/setup-shorebird@v1
      - uses: actions/cache@v4
        with:
          path: ~/.shorebird
          key: ${{ runner.os }}-shorebird-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-shorebird-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .github/scripts/automation_tool/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: actions/cache@v4
        with:
          path: .github/scripts/automation_tool/lib/**/*.g.dart
          key: ${{ runner.os }}-generated-${{ hashFiles('**/*.dart') }}
          restore-keys: |
            ${{ runner.os }}-generated-

      - uses: actions/cache@v4
        with:
          path: |
            build/app
            build/flutter_assets
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('**/pubspec.lock', 'lib/**/*.dart') }}
          restore-keys: |
            ${{ runner.os }}-flutter-build-

      - working-directory: .github/scripts/automation_tool
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs

      - id: deploy_logic
        working-directory: .
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          FLAVOR: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_ROOT: ${{ github.workspace }}
        run: dart .github/scripts/automation_tool/bin/main.dart deploy

      - if: steps.deploy_logic.outputs.is_new_release == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_ADMIN_SDK }}
          groups: "internal-testers"
          file: build/app/outputs/flutter-apk/app-${{ github.ref_name }}-release.apk

      - if: steps.deploy_logic.outputs.is_new_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.deploy_logic.outputs.version }}
          files: build/app/outputs/flutter-apk/*.apk
          prerelease: ${{ github.ref_name == 'dev' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.deploy_logic.outputs.is_new_release == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add android_appcast.xml
          git commit -m "chore: update appcast to ${{ steps.deploy_logic.outputs.version }} [skip ci]"
          git push

      - if: steps.deploy_logic.outputs.is_new_release == 'true'
        working-directory: .github/scripts/automation_tool
        env:
          FIREBASE_PROJECT_NUMBER: "448994699498"
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: dart bin/main.dart cleanup
        continue-on-error: true
