name: Deploy Android Shorebird

on:
  workflow_call:
    inputs:
      flavor:
        type: string
        required: true
      full_version:
        type: string
        required: true
      base_version:
        type: string
        required: true
    outputs:
      changed:
        value: ${{ jobs.deploy.outputs.changed }}
    secrets:
      SHOREBIRD_TOKEN:
        required: true
      FIREBASE_APP_ID:
        required: true
      FIREBASE_ADMIN_SDK:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.flavor }}
    outputs:
      changed: ${{ steps.deploy.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - id: deploy
        shell: bash
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          version="${{ inputs.full_version }}"
          baseVersion="${{ inputs.base_version }}"
          flavor="${{ inputs.flavor }}"

          TARGET_ID="e962126d-ee7a-48f2-b89d-fb0349f4a05f"
          if [ "$flavor" = "prod" ]; then
            TARGET_ID="ed427ccb-5edb-4594-a376-2ee9636bef4e"
          fi

          sed -i "s/^app_id:.*/app_id: $TARGET_ID/" shorebird.yaml
          echo "✅ App ID: $TARGET_ID"

          androidReleaseVersion="$version"
          if [ "$flavor" != "prod" ]; then
            androidReleaseVersion=$(echo "$version" | sed "s/+/-$flavor+/")
          fi

          echo "📱 Android version: $androidReleaseVersion"
          versionChanged=false

          if shorebird patch android --flavor=$flavor --build-name="$baseVersion" --release-version="$androidReleaseVersion" --dart-define=ENV=$flavor '--' --no-tree-shake-icons 2>&1 | tee /tmp/patch_output; then
            echo "✅ Android patch succeeded"
          else
            if grep -q "Release not found\|No release exists\|UnpatchableChangeException\|asset changes" /tmp/patch_output; then
              echo "🚀 Attempting release (patch not possible)..."
              if shorebird release android --flavor=$flavor --build-name="$baseVersion" --dart-define=ENV=$flavor '--' --no-tree-shake-icons 2>&1 | tee /tmp/release_output; then
                versionChanged=true
              else
                if grep -q "existing.*release\|already exists" /tmp/release_output; then
                  echo "⚠️ Release already exists for this version, skipping..."
                  versionChanged=false
                else
                  echo "❌ Release failed"
                  exit 1
                fi
              fi
            else
              echo "❌ Android failed"
              exit 1
            fi
          fi

          echo "changed=$versionChanged" >> $GITHUB_OUTPUT

      - name: Upload AAB Artifact
        if: hashFiles('build/app/outputs/bundle/*/*.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ inputs.flavor }}
          path: build/app/outputs/bundle/*/*.aab
          retention-days: 1

      - name: Find AAB file
        if: steps.deploy.outputs.changed == 'true'
        id: find_aab
        run: |
          echo "🔍 Looking for AAB files..."
          find build/app/outputs -name "*.aab" -type f 2>/dev/null | head -5
          ls -la build/app/outputs/bundle/*/ 2>/dev/null || echo "No bundle directories found"

          # Find the actual AAB file
          AAB_PATH=$(find build/app/outputs -name "*.aab" -type f 2>/dev/null | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "❌ No AAB file found"
            exit 1
          fi
          echo "found=true" >> $GITHUB_OUTPUT
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT
          echo "✅ Found AAB: $AAB_PATH"

      - name: Firebase Distribution
        if: steps.deploy.outputs.changed == 'true' && steps.find_aab.outputs.found == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_ADMIN_SDK }}
          groups: "internal-testers"
          file: ${{ steps.find_aab.outputs.aab_path }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_ADMIN_SDK }}
