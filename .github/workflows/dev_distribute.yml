name: Distribute App
on:
  push:
    branches: [prod, dev]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.41.4" }
      - uses: shorebirdtech/setup-shorebird@v1

      - id: check_type
        run: |
          if shorebird patch android --flavor ${{ github.ref_name }} --dry-run; then
             echo "is_new_release=false" >> $GITHUB_OUTPUT
             echo "new_release=false" > release_status.txt
             shorebird patch android --flavor ${{ github.ref_name }} --target lib/main.dart -- --dart-define=ENV=${{ github.ref_name }}
           else
             echo "Patch failed or native changes detected. Checking if release exists..."
             CURRENT_VER=$(grep 'version:' pubspec.yaml | sed 's/version: //')
             if shorebird release android --flavor ${{ github.ref_name }} --dry-run; then
               echo "is_new_release=true" >> $GITHUB_OUTPUT
               echo "new_release=true" > release_status.txt
               shorebird release android --flavor ${{ github.ref_name }} --artifact apk --target lib/main.dart -- --dart-define=ENV=${{ github.ref_name }}
             else
               echo "Error: Release $CURRENT_VER already exists and Patch is not possible due to Native changes."
               echo "Action required: Please bump the version in pubspec.yaml"
               exit 1
             fi
           fi
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      - if: steps.check_type.outputs.is_new_release == 'true'
        uses: actions/cache/save@v4
        with:
          path: release_flag.txt
          key: cache-release-flag-${{ github.run_id }}
      - if: steps.check_type.outputs.is_new_release == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_ADMIN_SDK }}
          groups: "apk"
          file: ${{ github.ref_name == 'prod' && 'build/app/outputs/flutter-apk/app-release.apk' || format('build/app/outputs/flutter-apk/app-{0}-release.apk', github.ref_name) }}
          releaseNotes: "new"
