name: Dev Distribute
on:
  push:
    branches: [dev]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.41.4" }
      - uses: shorebirdtech/setup-shorebird@v1

      - name: Shorebird Process
        id: check_type
        run: |
          if shorebird patch android --flavor dev --dry-run; then
            echo "new_release=false" > release_status.txt
            shorebird patch android --flavor dev --target lib/main.dart -- --split-per-abi --dart-define=ENV=dev
          else
            echo "new_release=true" > release_status.txt
            shorebird release android --flavor dev --artifact apk --target lib/main.dart -- --dart-define=ENV=dev
          fi
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      - name: Upload Universal APK to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: "testers"
          file: build/app/outputs/flutter-apk/app-dev-release.apk
          releaseNotes: "إصدار شامل - تحديث هوائي مفعل"
