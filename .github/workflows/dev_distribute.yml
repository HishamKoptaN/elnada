name: dev_distribute
on:
  push:
    branches:
      - dev
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true
      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Install Dependencies
        run: flutter pub get
      - name: Shorebird Release
        run: |
          shorebird release android --flavor dev \
          --artifact apk \
          --target-platform android-arm,android-arm64,android-x64 \
          -- --split-per-abi -t lib/main.dart --dart-define=ENV=dev
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      - name: Upload v7a to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: "armeabi-v7a"
          file: build/app/outputs/flutter-apk/app-armeabi-v7a-dev-release.apk
          releaseNotes: "armeabi-v7a"
      - name: Upload v8a to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: "arm64-v8a"
          file: build/app/outputs/flutter-apk/app-arm64-v8a-dev-release.apk
          releaseNotes: "arm64-v8a"
      - name: Upload Universal APK to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: "apk"
          file: build/app/outputs/flutter-apk/app-dev-release.apk
          releaseNotes: "apk"
