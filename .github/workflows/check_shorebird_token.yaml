name: Check Shorebird Token

on:
    workflow_dispatch:
    push:
        branches: [dev]

env:
    CACHE_BUSTER: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
    validate-token:
        runs-on: windows-latest
        environment: dev

        steps:
            - name: Clear cache and checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  clean: true

            - name: Force environment refresh
              shell: pwsh
              run: |
                  Write-Host "🔄 Refreshing environment variables..."
                  Write-Host "📅 Cache buster: ${{ secrets.CACHE_BUSTER }}"
                  $env:SHOREBIRD_TOKEN = "${{ secrets.SHOREBIRD_TOKEN }}"
                  Write-Host "📏 Token length: $($env:SHOREBIRD_TOKEN.Length)"

            - name: 1. Setup Shorebird
              uses: shorebirdtech/setup-shorebird@v1

            - name: 2. Verify Token Presence and Format
              shell: pwsh
              env:
                  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
              run: |
                  Write-Host "🔍 Checking token..."
                  Write-Host "📏 Token length: $($env:SHOREBIRD_TOKEN.Length)"

                  if ([string]::IsNullOrEmpty($env:SHOREBIRD_TOKEN)) {
                    Write-Error "❌ Error: SHOREBIRD_TOKEN is empty or not found in Secrets!"
                    Write-Host "🔧 Please check GitHub Secrets settings"
                    exit 1
                  }

                  Write-Host "✅ Token found in environment variables."

                  # فحص إذا كان يبدأ بـ ey (تشفير Base64 المعتاد لـ Shorebird)
                  if ($env:SHOREBIRD_TOKEN.StartsWith("ey")) {
                    Write-Host "✅ Token format looks correct (starts with 'ey')."
                  } else {
                    Write-Warning "⚠️ Token doesn't start with 'ey'. Please verify you copied the full string."
                    Write-Host "📋 Token preview: $($env:SHOREBIRD_TOKEN.Substring(0, 20))..."
                  }

            - name: 3. Test Authentication with Shorebird CLI
              shell: pwsh
              env:
                  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
              run: |
                  Write-Host "🔐 Testing Shorebird authentication..."
                  try {
                    shorebird me
                    Write-Host "✅ Authentication successful!"
                  } catch {
                    Write-Host "❌ Authentication failed: $_"
                    exit 1
                  }
