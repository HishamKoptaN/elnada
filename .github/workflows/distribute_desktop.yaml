name: Distribute Desktop

on:
    push:
        branches: [prod, dev]

permissions:
    contents: write

jobs:
    build_desktop:
        runs-on: windows-latest
        steps:
            # 1️⃣ Checkout repo
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # 2️⃣ Install Flutter
            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true

            # 3️⃣ Get version from pubspec.yaml
            - id: get_version
              shell: pwsh
              run: |
                  $line = Get-Content pubspec.yaml | Select-String "^version: "
                  $fullVersion = ($line -split " ")[1].Trim()
                  $version = $fullVersion.Split("+")[0]
                  echo "FULL_VERSION=$version" >> $env:GITHUB_OUTPUT

            # 4️⃣ Update Inno Setup script with version
            - name: Update Version in ISS
              shell: pwsh
              run: |
                  $issPath = "installers/abujena_setup.iss"
                  if (Test-Path $issPath) {
                    $content = Get-Content $issPath -Raw
                    $newContent = $content -replace "APP_VERSION_PLACEHOLDER", "${{ steps.get_version.outputs.FULL_VERSION }}"
                    [System.IO.File]::WriteAllText((Get-Item $issPath).FullName, $newContent)
                  }

            # 5️⃣ Enable Windows desktop and get dependencies
            - run: flutter config --enable-windows-desktop
            - run: flutter pub get

            # 6️⃣ Build Windows release
            - run: flutter build windows --release --dart-define=ENV=${{ github.ref_name }}

            # 7️⃣ Compile installer with Inno Setup
            - name: Compile Inno Setup
              shell: pwsh
              run: |
                  & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ./installers/abujena_setup.iss

            # 8️⃣ Prepare exe file and rename
            - id: prepare_assets
              shell: pwsh
              run: |
                  if ("${{ github.ref_name }}" -eq "dev") {
                      $newName = "abujena_dawajen_dev.exe"
                  } else {
                      $newName = "abujena_dawajen.exe"
                  }
                  $setupFile = Get-ChildItem "installers/*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
                  Rename-Item -Path $setupFile.FullName -NewName $newName
                  echo "FINAL_FILE_NAME=$newName" >> $env:GITHUB_ENV

            # 9️⃣ Update XML with version, shortVersionString, url, and file length
            - name: Update Appcast XML & Push
              shell: pwsh
              run: |
                  $version = "${{ steps.get_version.outputs.FULL_VERSION }}"
                  $fileName = "${{ env.FINAL_FILE_NAME }}"
                  $filePath = "installers/$fileName"
                  $fileLength = 0
                  if (Test-Path $filePath) {
                      $fileLength = (Get-Item $filePath).Length
                  }
                  $url = "https://github.com/${{ github.repository }}/releases/latest/download/$fileName"
                  $xmlPath = "desktop_appcast.xml"
                  $currentDate = Get-Date -Format "ddd, dd MMM yyyy HH:mm:ss K"

                  if (Test-Path $xmlPath) {
                      $content = Get-Content $xmlPath -Raw

                      # Replace/update enclosure attributes
                      $content = $content -replace 'sparkle:version="[^"]*"', "sparkle:version=""$version"""
                      if ($content -notmatch 'sparkle:shortVersionString="[^"]*"') {
                          $content = $content -replace '(<enclosure[^>]+)', '$1 sparkle:shortVersionString="' + $version + '"'
                      } else {
                          $content = $content -replace 'sparkle:shortVersionString="[^"]*"', "sparkle:shortVersionString=""$version"""
                      }
                      $content = $content -replace 'url="[^"]*"', "url=""$url"""
                      $content = $content -replace 'length="[^"]*"', "length=""$fileLength"""
                      $content = $content -replace '<title>Version [^<]*</title>', "<title>Version $version</title>"
                      $content = $content -replace '<pubDate>[^<]*</pubDate>', "<pubDate>$currentDate</pubDate>"

                      [System.IO.File]::WriteAllText((Get-Item $xmlPath).FullName, $content)

                      git config --global user.name "github-actions[bot]"
                      git config --global user.email "github-actions[bot]@users.noreply.github.com"
                      git add $xmlPath
                      git commit -m "chore: sync appcast to $version [skip ci]" || echo "No changes to commit"
                      git push origin ${{ github.ref_name }}
                  }

            # 10️⃣ Create or update release
            - name: Create/Update Latest Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: latest
                  name: "Latest (${{ github.ref_name }})"
                  body: "تم تحديث الإصدار تلقائياً. النسخة الحالية: ${{ steps.get_version.outputs.FULL_VERSION }}"
                  files: installers/${{ env.FINAL_FILE_NAME }}
                  make_latest: true
                  prerelease: ${{ github.ref_name == 'dev' }}
                  draft: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
