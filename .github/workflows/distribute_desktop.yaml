name: Distribute Desktop
on:
    push:
        branches: [prod, dev]
permissions:
    contents: write
jobs:
    build_desktop:
        runs-on: windows-latest
        environment: ${{ github.ref_name }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1
            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true
            - id: get_version
              shell: pwsh
              run: |
                  $line = Get-Content pubspec.yaml | Select-String "^version: "
                  $fullVersion = ($line -split " ")[1].Trim()
                  $pureVersion = ($fullVersion -split "\+")[0]
                  echo "FULL_VERSION=$pureVersion" >> $env:GITHUB_OUTPUT
            - shell: pwsh
              run: |
                  $issPath = "installers/abujena_setup.iss"
                  $content = Get-Content $issPath -Raw
                  $newContent = $content -replace "APP_VERSION_PLACEHOLDER", "${{ steps.get_version.outputs.FULL_VERSION }}"
                  [System.IO.File]::WriteAllText((Get-Item $issPath).FullName, $newContent)
            - run: flutter config --enable-windows-desktop
            - run: flutter pub get
            - run: flutter build windows --release --dart-define=ENV=${{ github.ref_name }}
            - name: Compile Inno Setup
              shell: pwsh
              run: |
                  & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ./installers/abujena_setup.iss
            - id: prepare_assets
              shell: pwsh
              run: |
                  $setupFile = Get-ChildItem "installers/*.exe" | Select-Object -First 1
                  $fileName = $setupFile.Name
                  if ("${{ github.ref_name }}" -eq "dev") {
                      $newName = $setupFile.BaseName + "_dev" + $setupFile.Extension
                      Rename-Item -Path $setupFile.FullName -NewName $newName
                      $fileName = $newName
                  }
                  echo "FINAL_FILE_NAME=$fileName" >> $env:GITHUB_ENV
                  echo "FILE_PATH=installers/$fileName" >> $env:GITHUB_ENV
            - uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.get_version.outputs.FULL_VERSION }}
                  files: ${{ env.FILE_PATH }}
                  body: "تحديث آلي لبرنامج أبو جينة للدواجن - نسخة ${{ github.ref_name }}"
                  make_latest: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Update Appcast XML
              shell: pwsh
              run: |
                  $tag = "v${{ steps.get_version.outputs.FULL_VERSION }}"
                  $url = "https://github.com/${{ github.repository }}/releases/download/$tag/${{ env.FINAL_FILE_NAME }}"
                  $xmlPath = "desktop_appcast.xml"
                  if (Test-Path $xmlPath) {
                      $version = "${{ steps.get_version.outputs.FULL_VERSION }}"
                      $content = Get-Content $xmlPath -Raw
                      # تحديث الإصدار والرابط داخل ملف الـ XML
                      $content = $content -replace 'sparkle:version="[^"]*"', "sparkle:version=""$version"""
                      $content = $content -replace 'url="[^"]*"', "url=""$url"""
                      [System.IO.File]::WriteAllText((Get-Item $xmlPath).FullName, $content)
                      git config --global user.name "github-actions[bot]"
                      git config --global user.email "github-actions[bot]@users.noreply.github.com"
                      git add $xmlPath
                      git commit -m "chore: update appcast to $version [skip ci]"
                      git push origin ${{ github.ref_name }}
                  }
