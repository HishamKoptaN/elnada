name: Distribute Desktop
on:
    push:
        branches: [prod, dev]
permissions:
    contents: write
    packages: write
jobs:
    build_desktop:
        runs-on: windows-latest
        environment: ${{ github.ref_name }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
            - id: get_version
              shell: pwsh
              run: |
                  $line = Get-Content pubspec.yaml | Select-String "^version: "
                  $version = ($line -split " ")[1].Trim()
                  $cleanVersion = ($version -split "\+")[0]
                  echo "VERSION=$cleanVersion" >> $env:GITHUB_OUTPUT
            - run: flutter config --enable-windows-desktop
            - run: flutter pub get
            - run: flutter build windows --release --dart-define=ENV=${{ github.ref_name }}
            - run: dart run msix:create
            - uses: actions/upload-artifact@v4
              with:
                  path: build/windows/x64/runner/Release/*.msix
            - uses: softprops/action-gh-release@v2
              with:
                  tag_name: desktop_msix
                  files: build/windows/x64/runner/Release/*.msix
                  body: "desktop msix"
                  make_latest: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - shell: pwsh
              env:
                  VERSION: ${{ steps.get_version.outputs.VERSION }}
              run: |
                  $msixFile = Get-ChildItem "build/windows/x64/runner/Release/*.$fileName = $msixFile.Name

                  $currentVer = $env:VERSION
                  $url = "https://github.com/${{ github.repository }}/releases/download/v$currentVer/$fileName"

                  $xmlPath = "desktop_appcast.xml"
                  $content = Get-Content $xmlPath -Raw

                  $content = $content -replace 'sparkle:version="[^"]*"', "sparkle:version=""$currentVer"""
                  $content = $content -replace 'url="[^"]*"', "url=""$url"""

                  [System.IO.File]::WriteAllText((Get-Item $xmlPath).FullName, $content)

                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add $xmlPath
                  git commit -m "chore: update desktop appcast to $currentVer [skip ci]"
                  git push
