name: 🔍 Prepare and Check

on:
    workflow_call:
        outputs:
            deploy_mode:
                value: ${{ jobs.check.outputs.mode }}
            app_version:
                value: ${{ jobs.check.outputs.version }}

jobs:
    check:
        runs-on: windows-latest
        outputs:
            mode: ${{ steps.decide.outputs.DEPLOY_MODE }}
            version: ${{ steps.decide.outputs.FULL_VERSION }}
        steps:
            - uses: actions/checkout@v4
            - uses: shorebirdtech/setup-shorebird@v1

            - id: decide
              shell: pwsh
              env:
                  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
              run: |
                  # 1. جلب الإصدار
                  $v = (Get-Content pubspec.yaml | Select-String "^version: ").ToString().Split(":")[1].Trim()
                  echo "FULL_VERSION=$v" >> $env:GITHUB_OUTPUT

                  $list = shorebird releases list | Out-String

                  $v_escaped = [regex]::Escape($v)
                  if ($list -match $v_escaped) {
                     echo "DEPLOY_MODE=PATCH" >> $env:GITHUB_OUTPUT
                     Write-Host "✅ Decision: PATCH" -ForegroundColor Green
                  } else {
                     echo "DEPLOY_MODE=RELEASE" >> $env:GITHUB_OUTPUT
                     Write-Host "✅ Decision: RELEASE" -ForegroundColor Cyan
                  }
