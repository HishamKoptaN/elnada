name: abujena_automation
description: نظام أتمتة بناء وتوزيع تطبيق أبوجنى باستخدام Clean Architecture و BLoC
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # Core
  dio: ^5.4.0
  retrofit: ^4.1.0
  get_it: ^7.6.4
  
  # State Management
  bloc: ^8.1.2
  
  # Data Classes
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # System Tools
  process_run: ^1.1.0
  args: ^2.4.2
  yaml: ^3.1.2
  path: ^1.9.0

dev_dependencies:
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  retrofit_generator: ^6.0.0
  test: ^1.25.0
  mockito: ^5.4.4
  bloc_test: ^9.1.5
