flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/logos/
    - shorebird.yaml
  fonts:
    - family: Cairo 
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf
          weight: 700  
flutter_assets:
    assets_path: assets/images/
    output_path: lib/core/utils
    filename: app_images.dart
    field_prefix: null
scripts:
  check-length: dart scripts/check_file_length.dart
  analyze: flutter analyze
  format: dart format .

msix_config:
  display_name: AbuJena Dawajen 
  publisher_display_name: AbuJena Dawajen
  identity_name: com.AbuJena.dawajen
  publisher: "CN=AbuJenaDawajen, O=AbujenaDawajen, C=EG"
  certificate_path: certificate.pfx
  certificate_password: "1632001"
  capabilities: internetClient
  install_certificate: false
  msix_version: 1.0.0.0
  logo_path: assets/logos/logo.jpg
  vclibs: true
  build_windows: false
  architecture: x64
