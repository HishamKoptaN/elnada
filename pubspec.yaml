name: taha
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_datagrid: ^32.2.7  
  retrofit: ^4.9.0
  logger: ^2.6.0
  json_annotation: ^4.9.0
  dio: ^5.8.0+1
  freezed_annotation: ^3.1.0
  injectable: ^2.4.2
  json_serializable: ^6.11.2  
  get_it: ^9.2.0
  pretty_dio_logger: ^1.4.0
  bloc: ^9.0.0
  connectivity_plus: ^7.0.0
  go_router: ^17.0.1
  form_inputs:
    git:
      url: https://github.com/HishamKoptaN/form_inputs.git
      ref: main
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  font_awesome_flutter: ^10.7.0
  formz: ^0.8.0
  hydrated_bloc: ^10.0.0
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  internet_connection_checker_plus: ^2.9.1+2
  equatable: ^2.0.8
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  retrofit_generator: ^10.0.1
  build_runner: ^2.6.0
  json_serializable: ^6.10.0
  freezed: ^3.2.3
  injectable_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/logos/
flutter_assets:
    assets_path: assets/images/
    output_path: lib/core/utils
    filename: app_images.dart
    field_prefix: null